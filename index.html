<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistente Psicopedagógico - Hospital</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-menu { width: 100%; padding: 15px; margin: 5px 0; background: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        textarea, input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .historial-card { border-left: 5px solid #27ae60; padding: 10px; background: #f9f9f9; margin: 10px 0; position: relative; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-size: 0.8em; }
        .turno-box { background: #eef2f3; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #d1d8e0; }
        .grid-turnos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media(max-width: 600px) { .grid-turnos { grid-template-columns: 1fr; } }
        #file-input { display: none; }
    </style>

    <!-- Firebase App (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAv4ErfP4i5aduTRCpraWpyOO6lyoSYhbo",
          authDomain: "asistente-7770a.firebaseapp.com",
          databaseURL: "https://asistente-7770a-default-rtdb.firebaseio.com",
          projectId: "asistente-7770a",
          storageBucket: "asistente-7770a.firebasestorage.app",
          messagingSenderId: "766477035272",
          appId: "1:766477035272:web:29af83ae2cec654a316ebd",
          measurementId: "G-GMW3EM3M6S"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getDatabase(app);

        window.db = [];
        window.agendaHospital = {};
        window.listaEsperaData = '';
        window.exPacientesDb = [];

        window.sincronizarConNube = async function() {
            try {
                const snapshot = await get(ref(dbCloud, 'psico_data'));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    window.db = data.db || [];
                    window.agendaHospital = data.agendaHospital || {};
                    window.listaEsperaData = data.listaEspera || '';
                    window.exPacientesDb = data.exPacientes || [];
                }
                if(typeof renderizarTurnosDia === 'function' && document.getElementById('hospital-turnos-view').style.display === 'block') {
                    renderizarTurnosDia();
                }
                if(typeof renderizarHistorial === 'function' && document.getElementById('work-area').style.display === 'block') {
                    renderizarHistorial();
                }
                if(typeof renderizarHistorialGen === 'function' && document.getElementById('work-area-general').style.display === 'block') {
                    renderizarHistorialGen();
                }
            } catch (error) {
                console.error("Error al leer de la nube:", error);
            }
        };

        window.guardarEnNube = function() {
            const dataCompleta = {
                db: window.db,
                agendaHospital: window.agendaHospital,
                listaEspera: window.listaEsperaData,
                exPacientes: window.exPacientesDb
            };
            set(ref(dbCloud, 'psico_data'), dataCompleta).catch((error) => {
                console.error("Error al guardar en la nube:", error);
            });
        };

        window.addEventListener('DOMContentLoaded', async () => {
            await window.sincronizarConNube();
        });
    </script>
</head>
<body>

<div class="container">
    <div id="nav-menu">
        <h1>Ámbito de Trabajo (Nube ☁️)</h1>
        <button class="btn-menu" onclick="iniciarModulo('ESCUELA')">🏫 ESCUELA</button>
        <button class="btn-menu" onclick="iniciarModulo('EIPRI')">👶 EIPRI</button>
        <button class="btn-menu" style="background:#16a085" onclick="iniciarMenuHospital()">🏥 HOSPITAL (Agenda y Consultorio)</button>
        <hr>
        <button class="btn-menu" style="background:#8e44ad" onclick="document.getElementById('file-input').click()">📂 CARGAR RESPALDO LOCAL</button>
        <input type="file" id="file-input" accept=".json" onchange="cargarRespaldo(event)">
        <button class="btn-menu" style="background:#d35400" onclick="exportarRespaldo()">3. DESCARGAR RESPALDO GENERAL</button>
    </div>

    <div id="hospital-dias" style="display:none;">
        <button onclick="location.reload()">⬅ Volver al Menú Principal</button>
        <h2>🏥 Agenda Hospital - Seleccioná el Día</h2>
        <button class="btn-menu" onclick="abrirDia('Lunes')">📅 LUNES (6 Turnos)</button>
        <button class="btn-menu" onclick="abrirDia('Martes')">📅 MARTES (6 Turnos)</button>
        <button class="btn-menu" onclick="abrirDia('Miercoles')">📅 MIÉRCOLES (6 Turnos)</button>
        <button class="btn-menu" onclick="abrirDia('Jueves')">📅 JUEVES (6 Turnos)</button>
        <hr>
        <h3>📋 Lista de Espera</h3>
        <textarea id="lista-espera" placeholder="Anotá aquí pacientes en lista de espera..." oninput="guardarEspera()"></textarea>
        <hr>
        <h3>📁 Ex Pacientes (Altas / Archivados)</h3>
        <div id="lista-ex-pacientes"></div>
    </div>

    <div id="hospital-turnos-view" style="display:none;">
        <button onclick="iniciarMenuHospital()">⬅ Volver a Días</button>
        <h2 id="titulo-dia"></h2>
        <div id="contenedor-6-turnos"></div>
    </div>

    <div id="work-area" style="display:none;">
        <button onclick="volverDesdeFicha()">⬅ Volver a la Agenda</button>
        <h2 id="titulo-ambito"></h2>
        
        <input type="text" id="nombre-paciente" placeholder="Nombre del Paciente" readonly style="background:#eee;">
        <input type="text" id="dni-paciente" placeholder="DNI del Paciente" readonly style="background:#eee;">
        <select id="tipo-doc">
            <option>Informe</option>
            <option>Acta</option>
            <option>Historia Clínica</option>
        </select>
        <textarea id="obs-nueva" placeholder="Observaciones / Motivo..."></textarea>
        
        <button class="btn-menu" onclick="generarPrompt()">1. GENERAR PROMPT</button>
        <textarea id="prompt-box" rows="3"></textarea>
        <textarea id="respuesta-ia" rows="5" placeholder="Pega aquí la respuesta de la IA..."></textarea>
        
        <button class="btn-menu" style="background:#27ae60" onclick="registrarIntervencion()">2. GUARDAR INTERVENCIÓN</button>

        <h3>📂 Historial del Paciente:</h3>
        <div id="lista-historial"></div>
    </div>

    <div id="work-area-general" style="display:none;">
        <button onclick="location.reload()">⬅ Volver</button>
        <h2 id="titulo-ambito-gen"></h2>
        
        <input type="text" id="nombre-paciente-gen" placeholder="Nombre del Paciente">
        <select id="tipo-doc-gen">
            <option>Informe</option>
            <option>Acta</option>
            <option>Historia Clínica</option>
        </select>
        <textarea id="obs-nueva-gen" placeholder="Observaciones / Motivo..."></textarea>
        
        <button class="btn-menu" onclick="generarPromptGen()">1. GENERAR PROMPT</button>
        <textarea id="prompt-box-gen" rows="3"></textarea>
        <textarea id="respuesta-ia-gen" rows="5" placeholder="Pega aquí la respuesta de la IA..."></textarea>
        
        <button class="btn-menu" style="background:#27ae60" onclick="registrarIntervencionGen()">2. GUARDAR INTERVENCIÓN</button>

        <h3>📂 Historial:</h3>
        <div id="lista-historial-gen"></div>
    </div>
</div>

<script>
    let ambitoActual = '';
    let diaActual = '';
    let turnoActualIdx = null;
    let pacienteActualNombre = '';

    function iniciarModulo(ambito) {
        ambitoActual = ambito;
        document.getElementById('nav-menu').style.display = 'none';
        document.getElementById('work-area-general').style.display = 'block';
        document.getElementById('titulo-ambito-gen').innerText = "Ámbito: " + ambito;
        renderizarHistorialGen();
    }

    function iniciarMenuHospital() {
        document.getElementById('nav-menu').style.display = 'none';
        document.getElementById('work-area').style.display = 'none';
        document.getElementById('hospital-turnos-view').style.display = 'none';
        document.getElementById('hospital-dias').style.display = 'block';
        
        document.getElementById('lista-espera').value = window.listaEsperaData || '';
        renderizarExPacientes();
    }

    function guardarEspera() {
        window.listaEsperaData = document.getElementById('lista-espera').value;
        window.guardarEnNube();
    }

    function abrirDia(dia) {
        diaActual = dia;
        document.getElementById('hospital-dias').style.display = 'none';
        document.getElementById('hospital-turnos-view').style.display = 'block';
        document.getElementById('titulo-dia').innerText = "Turnos del Día: " + dia;
        renderizarTurnosDia();
    }

    function renderizarTurnosDia() {
        let cont = document.getElementById('contenedor-6-turnos');
        if(!window.agendaHospital[diaActual]) {
            window.agendaHospital[diaActual] = Array(6).fill({nombre: '', edad: '', dni: ''});
        }

        let html = '';
        for(let i=0; i<6; i++) {
            let t = window.agendaHospital[diaActual][i] || {nombre: '', edad: '', dni: ''};
            html += `
                <div class="turno-box">
                    <strong>Turno ${i+1}</strong>
                    <input type="text" id="nombre_t_${i}" placeholder="Nombre del Paciente" value="${t.nombre}" onchange="actualizarTurno(${i})">
                    <div class="grid-turnos">
                        <input type="text" id="edad_t_${i}" placeholder="Edad" value="${t.edad}" onchange="actualizarTurno(${i})">
                        <input type="text" id="dni_t_${i}" placeholder="DNI" value="${t.dni}" onchange="actualizarTurno(${i})">
                    </div>
                    <button class="btn-menu" style="margin-top:5px; background:#2980b9;" onclick="abrirFichaTurno(${i})">📁 Ficha / Escrituras</button>
                    <button class="btn-delete" style="width:100%; margin-top:5px;" onclick="liberarTurno(${i})">🔄 Dar de Alta / Liberar Turno</button>
                </div>
            `;
        }
        cont.innerHTML = html;
    }

    function actualizarTurno(i) {
        let nombre = document.getElementById(`nombre_t_${i}`).value;
        let edad = document.getElementById(`edad_t_${i}`).value;
        let dni = document.getElementById(`dni_t_${i}`).value;

        window.agendaHospital[diaActual][i] = {nombre, edad, dni};
        window.guardarEnNube();
    }

    function abrirFichaTurno(i) {
        let t = window.agendaHospital[diaActual][i];
        if(!t || !t.nombre) return alert("Primero ingresá al menos el nombre del paciente en este turno.");
        
        turnoActualIdx = i;
        pacienteActualNombre = t.nombre;
        ambitoActual = "HOSPITAL - " + diaActual;

        document.getElementById('hospital-turnos-view').style.display = 'none';
        document.getElementById('work-area').style.display = 'block';
        document.getElementById('titulo-ambito').innerText = `Consultorio: ${t.nombre} (${diaActual} - Turno ${i+1})`;
        document.getElementById('nombre-paciente').value = t.nombre;
        document.getElementById('dni-paciente').value = t.dni || '';
        
        renderizarHistorial();
    }

    function volverDesdeFicha() {
        document.getElementById('work-area').style.display = 'none';
        document.getElementById('hospital-turnos-view').style.display = 'block';
        renderizarTurnosDia();
    }

    function liberarTurno(i) {
        let t = window.agendaHospital[diaActual][i];
        if(!t || !t.nombre) return alert("Este turno ya está vacío.");
        
        if(confirm(`¿Estás seguro de dar de alta a ${t.nombre}? El turno quedará libre y sus datos se moverán a Ex Pacientes.`)) {
            let pIndex = window.db.findIndex(x => x.nombre === t.nombre && x.ambito.includes('HOSPITAL'));
            if(pIndex !== -1) {
                window.exPacientesDb.push(window.db[pIndex]);
                window.db.splice(pIndex, 1);
            }

            window.agendaHospital[diaActual][i] = {nombre: '', edad: '', dni: ''};
            window.guardarEnNube();
            renderizarTurnosDia();
            alert("Turno liberado y paciente archivado correctamente.");
        }
    }

    function renderizarExPacientes() {
        let cont = document.getElementById('lista-ex-pacientes');
        if(!window.exPacientesDb || window.exPacientesDb.length === 0) {
            cont.innerHTML = "<p style='color:#7f8c8d;'>No hay ex pacientes archivados todavía.</p>";
            return;
        }
        cont.innerHTML = window.exPacientesDb.map(p => `
            <div class="historial-card" style="border-left-color: #e67e22;">
                <strong>Ex Paciente: ${p.nombre}</strong>
                ${p.intervenciones.map(i => `
                    <div style="margin-top:5px; font-size:0.9em; background:#fff; padding:5px; border-radius:3px;">
                        <strong>${i.tipo} (${i.fecha})</strong>: ${i.respuesta || i.obs}
                    </div>`).join('')}
            </div>`).join('');
    }

    function registrarIntervencion() {
        let nombre = pacienteActualNombre;
        let nueva = {
            id: Date.now(),
            tipo: document.getElementById('tipo-doc').value,
            obs: document.getElementById('obs-nueva').value,
            prompt: document.getElementById('prompt-box').value,
            respuesta: document.getElementById('respuesta-ia').value,
            fecha: new Date().toLocaleDateString()
        };

        let p = window.db.find(x => x.nombre === nombre && x.ambito === ambitoActual);
        if (p) { p.intervenciones.push(nueva); } 
        else { window.db.push({ nombre, ambito: ambitoActual, intervenciones: [nueva] }); }
        
        window.guardarEnNube();
        alert("¡Guardado en la nube con éxito!");
        document.getElementById('obs-nueva').value = '';
        document.getElementById('prompt-box').value = '';
        document.getElementById('respuesta-ia').value = '';
        renderizarHistorial();
    }

    function renderizarHistorial() {
        let cont = document.getElementById('lista-historial');
        let pacientes = window.db.filter(x => x.ambito === ambitoActual && x.nombre === pacienteActualNombre);
        cont.innerHTML = pacientes.map(p => `
            <div>
                ${p.intervenciones.slice().reverse().map(i => `
                    <div class="historial-card">
                        <strong>${i.tipo} (${i.fecha})</strong>
                        <button class="btn-delete" style="float:right;" onclick="eliminarIntervencionFicha('${p.nombre}', ${i.id})">Eliminar</button><br>
                        <p style="font-size:0.9em; margin:5px 0;"><strong>Obs:</strong> ${i.obs}</p>
                        <p style="font-size:0.9em; margin:5px 0; background: #fff; padding: 5px; border-radius:3px;">${i.respuesta || "Sin respuesta"}</p>
                    </div>`).join('')}
            </div>`).join('');
    }

    function eliminarIntervencionFicha(n, id) {
        let p = window.db.find(x => x.nombre === n && x.ambito === ambitoActual);
        p.intervenciones = p.intervenciones.filter(i => i.id !== id);
        if(p.intervenciones.length === 0) window.db = window.db.filter(x => x.nombre !== n || x.ambito !== ambitoActual);
        window.guardarEnNube();
        renderizarHistorial();
    }

    function registrarIntervencionGen() {
        let nombre = document.getElementById('nombre-paciente-gen').value;
        if(!nombre) return alert("¡Poné un nombre!");

        let nueva = {
            id: Date.now(),
            tipo: document.getElementById('tipo-doc-gen').value,
            obs: document.getElementById('obs-nueva-gen').value,
            prompt: document.getElementById('prompt-box-gen').value,
            respuesta: document.getElementById('respuesta-ia-gen').value,
            fecha: new Date().toLocaleDateString()
        };

        let p = window.db.find(x => x.nombre === nombre && x.ambito === ambitoActual);
        if (p) { p.intervenciones.push(nueva); } 
        else { window.db.push({ nombre, ambito: ambitoActual, intervenciones: [nueva] }); }
        
        window.guardarEnNube();
        alert("¡Guardado en la nube con éxito!");
        renderizarHistorialGen();
    }

    function renderizarHistorialGen() {
        let cont = document.getElementById('lista-historial-gen');
        let pacientes = window.db.filter(x => x.ambito === ambitoActual);
        cont.innerHTML = pacientes.map(p => `
            <div><h4>Paciente: ${p.nombre}</h4>
                ${p.intervenciones.slice().reverse().map(i => `
                    <div class="historial-card">
                        <strong>${i.tipo} (${i.fecha})</strong>
                        <button class="btn-delete" style="float:right;" onclick="eliminarIntervencionGen('${p.nombre}', ${i.id})">Eliminar</button><br>
                        <p style="font-size:0.9em; margin:5px 0;"><strong>Obs:</strong> ${i.obs}</p>
                        <p style="font-size:0.9em; margin:5px 0; background: #fff; padding: 5px; border-radius:3px;">${i.respuesta || "Sin respuesta"}</p>
                    </div>`).join('')}
            </div>`).join('');
    }

    function eliminarIntervencionGen(n, id) {
        let p = window.db.find(x => x.nombre === n && x.ambito === ambitoActual);
        p.intervenciones = p.intervenciones.filter(i => i.id !== id);
        if(p.intervenciones.length === 0) window.db = window.db.filter(x => x.nombre !== n || x.ambito !== ambitoActual);
        window.guardarEnNube();
        renderizarHistorialGen();
    }

    function exportarRespaldo() {
        let dataCompleta = {
            db: window.db,
            agendaHospital: window.agendaHospital,
            listaEspera: window.listaEsperaData,
            exPacientes: window.exPacientesDb
        };
        let blob = new Blob([JSON.stringify(dataCompleta)], {type: 'application/json'});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Respaldo_Completo_Psico.json';
        a.click();
    }

    function cargarRespaldo(event) {
        let file = event.target.files[0];
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let dataCompleta = JSON.parse(e.target.result);
                if(dataCompleta.db) {
                    window.db = dataCompleta.db;
                    window.agendaHospital = dataCompleta.agendaHospital || {};
                    window.listaEsperaData = dataCompleta.listaEspera || '';
                    window.exPacientesDb = dataCompleta.exPacientes || [];
                } else {
                    window.db = dataCompleta;
                }

                window.guardarEnNube();
                alert("¡Respaldo cargado y sincronizado en la nube con éxito!");
                location.reload();
            } catch(err) {
                alert("El archivo no es válido.");
            }
        };
        reader.readAsText(file);
    }
    
    function generarPrompt() {
        let p = `Redacta un/a ${document.getElementById('tipo-doc').value} para el/la paciente ${document.getElementById('nombre-paciente').value} (DNI: ${document.getElementById('dni-paciente').value}). Detalles clínicos: ${document.getElementById('obs-nueva').value}`;
        document.getElementById('prompt-box').value = p;
    }

    function generarPromptGen() {
        let p = `Redacta un/a ${document.getElementById('tipo-doc-gen').value} para ${document.getElementById('nombre-paciente-gen').value}. Detalles: ${document.getElementById('obs-nueva-gen').value}`;
        document.getElementById('prompt-box-gen').value = p;
    }
</script>
</body>
</html>
